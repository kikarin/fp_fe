<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Firstpective</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: #f8fafc;
        color: #111;
        text-align: center;
      }
      .code { color: #2f6bff; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.75rem; }
      h1 { font-size: clamp(1.75rem, 5vw, 2.25rem); font-weight: 600; margin-bottom: 0.75rem; }
      p { color: #666; max-width: 28rem; line-height: 1.6; margin-bottom: 2rem; font-size: 0.9375rem; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #2f6bff;
        color: #fff;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.875rem 2rem;
        border-radius: 9999px;
      }
      a:hover { background: #1a55e8; }
    </style>
  </head>
  <body>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or may have been moved.</p>
    <a href="/">Back to Home</a>
  </body>
</html>
